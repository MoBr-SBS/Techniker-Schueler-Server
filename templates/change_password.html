{% extends "base.html" %}
{% block title %}Passwort ändern{% endblock %}
{% block page_title %}Passwort ändern{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card widget">
    <div class="widget-header">
      <i data-lucide="lock"></i>
      <span>Passwort ändern</span>
    </div>
    <div class="widget-body">

      {% if error %}
      <div class="alert alert-error" style="margin-bottom:16px">{{ error }}</div>
      {% endif %}
      {% if success %}
      <div class="alert alert-success" style="margin-bottom:16px">{{ success }}</div>
      {% endif %}

      <form method="POST" action="/passwort" class="vform">
        <label>Aktuelles Passwort
          <input type="password" name="current_password" autocomplete="current-password" required>
        </label>
        <label>Neues Passwort <span class="form-hint">(min. 6 Zeichen)</span>
          <input type="password" name="new_password" autocomplete="new-password" required minlength="6">
        </label>
        <label>Neues Passwort bestätigen
          <input type="password" name="new_password2" autocomplete="new-password" required minlength="6">
        </label>
        <button type="submit" class="btn btn-primary">Passwort speichern</button>
      </form>

    </div>
  </div>
</div>
{% endblock %}

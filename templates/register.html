<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ server_name }} – Registrieren</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% if favicon_url %}<link rel="icon" href="{{ favicon_url }}">{% endif %}
</head>
<body class="login-body">

  <div class="login-card">

    <div class="login-logo">
      {% if logo_url %}
      <div class="logo-icon logo-icon--img"><img src="{{ logo_url }}" alt="Logo" class="logo-img"></div>
      {% else %}
      <div class="logo-icon"><i data-lucide="server"></i></div>
      {% endif %}
      <span class="logo-text">{{ server_name }}</span>
    </div>

    <div>
      <h1 class="login-heading">Registrieren</h1>
      <p class="login-sub">Erstelle dein Konto.</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register" class="vform">
      <label>Benutzername
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label>Passwort
        <input type="password" name="password" autocomplete="new-password" required>
        <span class="form-hint">Mindestens 6 Zeichen.</span>
      </label>
      <label>Passwort wiederholen
        <input type="password" name="password2" autocomplete="new-password" required>
      </label>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
        Konto erstellen
      </button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:0.82rem;color:var(--text-muted)">
      Bereits registriert?
      <a href="/login" style="color:var(--accent)">Anmelden</a>
    </p>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>

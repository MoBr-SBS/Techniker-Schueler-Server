{% extends "base.html" %}
{% block title %}Mein Stundenplan{% endblock %}
{% block page_title %}Mein Stundenplan{% endblock %}

{% block content %}
<div id="sp-content">
  {% include "mein_stundenplan_content.html" %}
</div>

<script>
(function () {
  var content  = document.getElementById('sp-content');
  var editMode = false;

  var overlay = document.createElement('div');
  overlay.className = 'sp-loading-overlay';
  overlay.innerHTML = '<div class="sp-loading-spinner"></div>';
  content.appendChild(overlay);

  function showLoader() { overlay.classList.add('sp-loading-overlay--visible'); }
  function hideLoader() { overlay.classList.remove('sp-loading-overlay--visible'); }

  function applyEditMode() {
    var wrap = content.querySelector('#sp-table-wrap');
    var btn  = content.querySelector('#sp-edit-toggle');
    if (wrap) wrap.classList.toggle('sp-edit-mode', editMode);
    if (btn)  btn.classList.toggle('sp-edit-toggle--active', editMode);
  }

  function attachExForms() {
    content.querySelectorAll('.sp-ex-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var form = document.getElementById(btn.dataset.form);
        if (!form) return;
        var open = form.classList.toggle('sp-ex-form--open');
        if (open) form.querySelector('.sp-ex-notiz').focus();
      });
    });
    content.querySelectorAll('.sp-ex-cancel').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var form = document.getElementById(btn.dataset.form);
        if (form) form.classList.remove('sp-ex-form--open');
      });
    });
  }

  function loadWeek(url) {
    showLoader();

    fetch(url, {
      credentials: 'same-origin',
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      content.innerHTML = html;
      content.appendChild(overlay);
      history.pushState(null, '', url);
      lucide.createIcons();
      hideLoader();
      attachListeners();
      prefetchEdges();
    })
    .catch(function () { location.href = url; });
  }

  function prefetchEdges() {
    content.querySelectorAll('.sp-nav-arrow').forEach(function (a) {
      fetch(a.href, {
        credentials: 'same-origin',
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      }).catch(function () {});
    });
  }

  function attachListeners() {
    content.querySelectorAll('.sp-nav-arrow').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        loadWeek(this.href);
      });
    });

    var toggleBtn = content.querySelector('#sp-edit-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function () {
        editMode = !editMode;
        applyEditMode();
      });
    }

    var aktuForm = content.querySelector('form[action*="aktualisieren"]');
    if (aktuForm) {
      aktuForm.addEventListener('submit', function () { showLoader(); });
    }

    applyEditMode();
    attachExForms();
  }

  window.addEventListener('popstate', function () { loadWeek(location.href); });

  attachListeners();
  prefetchEdges();
})();
</script>
{% endblock %}
